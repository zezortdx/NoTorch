[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notorch-zero"
version = "0.1.0"
description = "Neural networks from scratch. No PyTorch. No TensorFlow. Just NumPy and pain."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zezortdx" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "matplotlib"]

[tool.hatch.build.targets.wheel]
packages = ["src/notorch"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "I", "RUF", "S", "BLE", "TRY"]
ignore = ["S101", "TRY003", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402", "S110", "S310", "BLE001", "TRY004"]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
